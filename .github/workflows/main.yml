name: Gerar APK - Guardiao de Dados

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compilar APK debug
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Guardiao-de-Dados-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
